name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  dependency-validation:
    name: Lockfile and Vulnerability Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Install exactly from the lockfile
        run: uv sync --frozen

      - name: Audit the locked dependency graph
        run: uv audit --frozen

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    needs: dependency-validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check code formatting with black
        run: uv run --frozen black --check src/ tests/

      - name: Lint with ruff
        run: uv run --frozen ruff check src/ tests/

      - name: Type check with mypy
        run: uv run --frozen mypy src/

  test-matrix:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit and MCP integration tests
        run: uv run --frozen pytest -W error::DeprecationWarning

      - name: Upload Python 3.11 coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Python 3.11 coverage artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  artifact-tests:
    name: Artifact install on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel and source distribution
        run: uv build

      - name: Install wheel in a clean environment
        run: |
          uv venv --python "${{ matrix.python-version }}" .venv-wheel
          uv pip install --python .venv-wheel/bin/python dist/*.whl

      - name: Smoke-test installed wheel outside the repository
        run: |
          temp_dir="$(mktemp -d)"
          cd "$temp_dir"
          "$GITHUB_WORKSPACE/.venv-wheel/bin/python" - <<'PY'
          import asyncio
          from importlib.metadata import version

          from lunar_mcp_server import __version__
          from lunar_mcp_server.lunar_calculations import LunarCalculator
          from lunar_mcp_server.server import LunarMCPServer

          assert __version__ == version("lunar-mcp-server")
          server = LunarMCPServer()
          assert server is not None
          result = asyncio.run(LunarCalculator().get_moon_phase("2024-03-25"))
          assert result["illumination"] == 0.001
          PY

      - name: Install source distribution in a clean environment
        run: |
          uv venv --python "${{ matrix.python-version }}" .venv-sdist
          uv pip install --python .venv-sdist/bin/python dist/*.tar.gz

      - name: Smoke-test installed source distribution outside the repository
        run: |
          temp_dir="$(mktemp -d)"
          cd "$temp_dir"
          "$GITHUB_WORKSPACE/.venv-sdist/bin/python" - <<'PY'
          import asyncio
          from importlib.metadata import version

          from lunar_mcp_server import __version__
          from lunar_mcp_server.lunar_calculations import LunarCalculator

          assert __version__ == version("lunar-mcp-server")
          result = asyncio.run(LunarCalculator().get_moon_phase("2024-03-25"))
          assert result["illumination"] == 0.001
          PY
